# Replaces nginx:alpine's default server. Cloudflare sits in front and only overrides a Cache-Control shorter than its 4 hour browser TTL.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The text files are UTF-8 (llms.txt names "Kılıç"); without a charset browsers read them as windows-1252.
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # The page and its text files always revalidate, so a deploy shows at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # SvelteKit's hashed build output never changes under the same name.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images, icons and fonts keep their names across deploys, so they are cached for a week rather than forever.
    location ~* \.(?:avif|webp|jpe?g|png|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
