---
variables:
  NODE_VERSION: 26-alpine
  NODE_PACKAGE_MANAGER: pnpm
  HK: '0'

stages:
  - install
  - build
  - publish
  - container

include:
  - project: devops/pipelines
    ref: node@2.1.1
    file:
      - /node/install.gitlab-ci.yml
      - /node/build.gitlab-ci.yml
      - /node/lint.gitlab-ci.yml

  - project: devops/pipelines
    ref: semantic-release@3.0.0
    file:
      - /semantic-release/publish.gitlab-ci.yml

  - project: devops/pipelines
    ref: buildah@2.3.0
    file:
      - /buildah/build.gitlab-ci.yml
      - /buildah/registry-gitlab.gitlab-ci.yml

  - project: devops/pipelines
    ref: references@1.5.0
    file: /references/workflow.gitlab-ci.yml

install:
  stage: install
  extends: .node-install

build:
  stage: build
  extends: .node-build
  needs:
    - install
  artifacts:
    paths:
      - '**/dist/'
      - '.svelte-kit/'
    exclude:
      - 'node_modules*'
      - 'node_modules/**/*'

lint:
  stage: build
  extends: .node-lint
  needs:
    - install
    - build

semantic-release:
  stage: publish
  extends: .semantic-release
  dependencies: []
  needs:
    - build
    - lint

container:
  stage: container
  extends: .container-build
  needs:
    - build
    - lint
  variables:
    CONTAINER_FILE_NAME: Dockerfile
    CONTAINER_IMAGE_NAME: $CI_REGISTRY_IMAGE/html
    CONTAINER_IMAGE_TAGS: latest
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
